<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Studio</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0e0e10; color:#f5f0e6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    text-align:center; padding:24px;
  }
  .card { max-width:420px; width:100%; }
  .lion { font-size:72px; }
  h1 { font-size:42px; letter-spacing:4px; margin:12px 0 8px; color:#f2b705; text-transform:uppercase; }
  .tag { font-size:17px; color:#cfc7b8; margin-bottom:20px; }
  .badge {
    display:inline-block; padding:8px 16px; border:1px solid #f2b705;
    border-radius:999px; color:#f2b705; font-size:13px; letter-spacing:1px;
  }
  .status {
    margin-top:24px; background:#17171b; border:1px solid #2a2a30;
    border-radius:12px; padding:14px; text-align:left; font-size:13px;
  }
  .status div { padding:4px 0; color:#cfc7b8; }
  .ok  { color:#4ade80; }
  .bad { color:#f87171; }
  .foot { margin-top:28px; font-size:12px; color:#6f6a5e; }
</style>
</head>
<body>
  <div class="card">
    <div class="lion">🦁</div>
    <h1>Lion Studio</h1>
    <div class="tag">Turn your products into cinema.</div>
    <div class="badge">v0.4 — VAULT UNDER TEST</div>

    <div class="status" id="status">
      <div>⚙️ config.js ……… <span id="s-config">checking…</span></div>
      <div>📡 Supabase library … <span id="s-lib">checking…</span></div>
      <div>🗄️ Tables …………… <span id="s-db">waiting…</span></div>
      <div>✍️ Write test ……… <span id="s-write">waiting…</span></div>
    </div>

    <div class="foot">Made in Ethiopia · AI videos for sellers</div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
(function(){
  var sConfig = document.getElementById('s-config');
  var sLib    = document.getElementById('s-lib');
  var sDb     = document.getElementById('s-db');
  var sWrite  = document.getElementById('s-write');

  if (window.LION && window.LION.SUPABASE_URL && window.LION.SUPABASE_ANON_KEY) {
    sConfig.textContent = 'OK ✅'; sConfig.className = 'ok';
  } else {
    sConfig.textContent = 'MISSING ❌'; sConfig.className = 'bad';
    sLib.textContent = sDb.textContent = sWrite.textContent = 'skipped'; return;
  }

  if (window.supabase && window.supabase.createClient) {
    sLib.textContent = 'OK ✅'; sLib.className = 'ok';
  } else {
    sLib.textContent = 'FAILED ❌'; sLib.className = 'bad';
    sDb.textContent = sWrite.textContent = 'skipped'; return;
  }

  var client;
  try {
    client = window.supabase.createClient(
      window.LION.SUPABASE_URL,
      window.LION.SUPABASE_ANON_KEY
    );
  } catch(e) {
    sDb.textContent = 'BAD URL ❌ ' + e.message; sDb.className = 'bad'; return;
  }

  (async function(){
    var r1 = await client.from('studio_jobs').select('id').limit(1);
    if (r1.error) {
      var m = r1.error.message || '', c = r1.error.code || '';
      if (c === '42P01' || c === 'PGRST205' || /does not exist|Could not find the table/i.test(m)) {
        sDb.textContent = 'TABLES MISSING ❌ (run the Block 3 SQL)';
      } else if (r1.status === 401 || c === 'PGRST301' || /invalid api key|jwt|401/i.test(m)) {
        sDb.textContent = 'KEY REJECTED ❌ ' + m;
      } else {
        sDb.textContent = 'ERROR ❌ ' + m;
      }
      sDb.className = 'bad'; sWrite.textContent = 'skipped'; return;
    }
    sDb.textContent = 'TABLES FOUND ✅'; sDb.className = 'ok';

    var r2 = await client.from('studio_jobs')
      .insert({ kind:'image', preset:'meter-test', prompt:'meter write test', status:'done', is_mock:true })
      .select('id').single();
    if (r2.error) {
      sWrite.textContent = 'WRITE FAILED ❌ ' + (r2.error.message || '');
      sWrite.className = 'bad'; return;
    }
    sWrite.textContent = 'WRITE ✅ (cleaning…)';

    await client.from('studio_jobs').delete().eq('id', r2.data.id);
    sWrite.textContent = 'WRITE+CLEAN ✅';
    sWrite.className = 'ok';
  })();
})();
</script>
</body>
</html>
