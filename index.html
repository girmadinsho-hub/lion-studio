<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lion Studio</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:#0e0e10; color:#f5f0e6;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    text-align:center; padding:24px;
  }
  .card { max-width:420px; width:100%; }
  .lion { font-size:72px; }
  h1 {
    font-size:42px; letter-spacing:4px; margin:12px 0 8px;
    color:#f2b705; text-transform:uppercase;
  }
  .tag { font-size:17px; color:#cfc7b8; margin-bottom:28px; }
  .badge {
    display:inline-block; padding:8px 16px; border:1px solid #f2b705;
    border-radius:999px; color:#f2b705; font-size:13px; letter-spacing:1px;
  }
  .foot { margin-top:40px; font-size:12px; color:#6f6a5e; }
</style>
</head>
<body>
  <div class="card">
    <div class="lion">🦁</div>
    <h1>Lion Studio</h1>
    <div class="tag">Turn your products into cinema.</div>
    <div class="badge">v0.1 — FOUNDATION UNDER CONSTRUCTION</div>
    <div class="foot">Made in Ethiopia · AI videos for sellers</div>
  </div>
</body>
</html>
